name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Validate version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "Tag: $TAG  pyproject version: $VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match pyproject.toml version $VERSION"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Twine check
        run: uv run --with twine twine check dist/*

      - name: Verify py.typed in wheel
        run: |
          uv run python -c "
          import zipfile, pathlib, sys
          whls = list(pathlib.Path('dist').glob('*.whl'))
          assert whls, 'no wheel built'
          for whl in whls:
              with zipfile.ZipFile(whl) as z:
                  names = z.namelist()
                  assert any(n.endswith('paxman/py.typed') for n in names), f'py.typed missing in {whl.name}: {names[:20]}'
                  print(f'py.typed Ships in {whl.name}')
          "

      - name: Upload artifacts
        uses: actions/upload-artifact@b9a412d6fe97c7e3b0db3ab2a18a097a374f3d5a # v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@8dd04b72b99d524359e2185adfa67c3a # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          print-hash: true
